name: Update Heart Dashboard

on:
  schedule:
    # 21:00 UTC = 00:00 EAT (Midnight)
    # 03:00 UTC = 06:00 EAT (Morning)
    # 09:00 UTC = 12:00 EAT (Noon)
    # 15:00 UTC = 18:00 EAT (Evening)
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Update SVG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          TZ: 'Africa/Nairobi' 
        run: python src/main.py
        
      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add heart.svg
          
          if git diff --staged --quiet heart.svg; then
            echo "No changes in activity. Skipping commit."
          else
            git commit -m "chore: update activity heart [skip ci]"
            git push
          fi
